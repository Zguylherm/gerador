<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel Admin - Keys</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --main: #ff2a2a;
      --bg: #050505;
      --card: rgba(18, 18, 18, 0.88);
      --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.62);
      --danger: #ff3b3b;
      --success: #2aff86;
      --warning: #ffcc66;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(255, 42, 42, 0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(255, 42, 42, 0.08), transparent 30%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      overflow-x: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    .login-screen {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top, rgba(255, 42, 42, 0.2), transparent 35%),
        #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 22px;
    }

    .login-box,
    .admin-panel {
      width: 100%;
      max-width: 470px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 26px;
      backdrop-filter: blur(18px);
      box-shadow:
        0 0 45px rgba(255, 42, 42, 0.22),
        inset 0 0 0 1px rgba(255,255,255,0.03);
      animation: showUp 0.35s ease;
    }

    @keyframes showUp {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 23px;
      line-height: 1.2;
      color: white;
    }

    .subtitle {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 14px 0 7px;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--border);
      outline: none;
      border-radius: 14px;
      padding: 13px 14px;
      background: rgba(5, 5, 5, 0.72);
      color: white;
      transition: 0.2s ease;
    }

    input:focus,
    select:focus {
      border-color: var(--main);
      box-shadow: 0 0 0 3px rgba(255, 42, 42, 0.14);
    }

    select {
      cursor: pointer;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px 14px;
      margin-top: 14px;
      background: linear-gradient(135deg, #ff2a2a, #b40000);
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s ease;
      box-shadow: 0 12px 26px rgba(255, 42, 42, 0.18);
    }

    button:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .btn-offline {
      background: rgba(255, 59, 59, 0.12);
      border: 1px solid rgba(255, 59, 59, 0.35);
      color: #ff8a8a;
      box-shadow: none;
      margin-top: 10px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .btn-online {
      background: rgba(42, 255, 134, 0.1);
      border: 1px solid rgba(42, 255, 134, 0.28);
      color: #8effbd;
      box-shadow: none;
      margin-top: 10px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .error {
      min-height: 20px;
      margin-top: 10px;
      color: #ff6b6b;
      font-size: 13px;
      text-align: center;
    }

    .success-msg {
      min-height: 20px;
      margin-top: 10px;
      color: #8effbd;
      font-size: 13px;
      text-align: center;
    }

    .result-box {
      margin-top: 18px;
      padding: 14px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .result-title {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .generated-key {
      width: 100%;
      min-height: 46px;
      border-radius: 12px;
      background: #080808;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 13px;
      font-family: Consolas, monospace;
      color: #fff;
      word-break: break-all;
      line-height: 1.4;
    }

    .info {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .keys-list {
      margin-top: 18px;
      max-height: 300px;
      overflow: auto;
      padding-right: 4px;
    }

    .key-item {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 10px;
    }

    .key-item.offline {
      border-color: rgba(255, 59, 59, 0.35);
      background: rgba(255, 59, 59, 0.06);
    }

    .key-code {
      font-family: Consolas, monospace;
      font-size: 13px;
      word-break: break-all;
    }

    .key-date {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .status-active {
      color: var(--success);
      font-weight: 700;
    }

    .status-expired {
      color: var(--warning);
      font-weight: 700;
    }

    .status-offline {
      color: var(--danger);
      font-weight: 700;
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .top-actions button {
      margin-top: 0;
    }

    @media (max-width: 480px) {
      .login-box,
      .admin-panel {
        padding: 22px;
        border-radius: 20px;
      }

      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <div class="brand">
        <h1>Painel Admin</h1>
        <p class="subtitle"></p>
      </div>

      <label for="adminPassword"></label>
      <input
        type="password"
        id="adminPassword"
        placeholder="Digite a senha"
        autocomplete="current-password"
      >

      <button id="loginBtn" onclick="loginAdmin()">Entrar</button>
      <p id="loginError" class="error"></p>
    </div>
  </div>

  <!-- PAINEL ADMIN -->
  <main id="adminPanel" class="admin-panel hidden">
    <div class="brand">
      <h1>Gerador de Keys</h1>
      <p class="subtitle">by zGuylherme</p>
    </div>

    <div class="top-actions">
      <button class="btn-secondary" onclick="logoutAdmin()">Sair</button>
      <button class="btn-secondary" onclick="carregarKeys()">Atualizar</button>
    </div>

    <label for="duration">Duração da key</label>
    <select id="duration">
      <option value="1">1 dia</option>
      <option value="3">3 dias</option>
      <option value="7">7 dias</option>
      <option value="15">15 dias</option>
      <option value="30">30 dias</option>
    </select>

    <button id="createBtn" onclick="gerarKey()">Gerar Key</button>

    <div class="result-box">
      <p class="result-title">Última key gerada</p>
      <div id="generatedKey" class="generated-key">Nenhuma key gerada ainda.</div>
      <p id="generatedInfo" class="info"></p>
      <button class="btn-secondary" onclick="copiarKey()">Copiar Key</button>
    </div>

    <p id="panelMsg" class="success-msg"></p>

    <div class="keys-list" id="keysList"></div>
  </main>

  <script>
    /*
      Usa o proxy do Netlify.
      Configure o arquivo netlify.toml para redirecionar /api/* para seu FastAPI.
    */
    const API_BASE = "/api";

    const loginScreen = document.getElementById("loginScreen");
    const adminPanel = document.getElementById("adminPanel");
    const adminPassword = document.getElementById("adminPassword");
    const loginError = document.getElementById("loginError");
    const loginBtn = document.getElementById("loginBtn");
    const createBtn = document.getElementById("createBtn");

    const generatedKey = document.getElementById("generatedKey");
    const generatedInfo = document.getElementById("generatedInfo");
    const keysList = document.getElementById("keysList");
    const panelMsg = document.getElementById("panelMsg");

    let lastKey = "";

    function getToken() {
      return sessionStorage.getItem("admin_token");
    }

    function setToken(token) {
      sessionStorage.setItem("admin_token", token);
    }

    function clearToken() {
      sessionStorage.removeItem("admin_token");
    }

    function showLogin() {
      loginScreen.classList.remove("hidden");
      adminPanel.classList.add("hidden");
    }

    function showPanel() {
      loginScreen.classList.add("hidden");
      adminPanel.classList.remove("hidden");
    }

    function setLoading(button, loading, textLoading, textNormal) {
      button.disabled = loading;
      button.textContent = loading ? textLoading : textNormal;
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function apiFetch(path, options = {}) {
      const token = getToken();

      const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
      };

      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }

      const response = await fetch(`${API_BASE}${path}`, {
        ...options,
        headers
      });

      let data = null;

      try {
        data = await response.json();
      } catch {
        data = {};
      }

      if (response.status === 401 || response.status === 403) {
        clearToken();
        showLogin();
        throw new Error(data.detail || data.message || "Sessão expirada. Faça login novamente.");
      }

      if (!response.ok) {
        throw new Error(data.detail || data.message || "Erro na API.");
      }

      return data;
    }

    async function loginAdmin() {
      const password = adminPassword.value.trim();

      if (!password) {
        loginError.textContent = "Digite a senha.";
        return;
      }

      loginError.textContent = "";
      setLoading(loginBtn, true, "Entrando...", "Entrar");

      try {
        const data = await fetch(`${API_BASE}/admin/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ password })
        }).then(async (res) => {
          const json = await res.json().catch(() => ({}));

          if (!res.ok) {
            throw new Error(json.detail || json.message || "Senha incorreta.");
          }

          return json;
        });

        if (!data.token) {
          throw new Error("A API não retornou token.");
        }

        setToken(data.token);
        adminPassword.value = "";
        showPanel();
        await carregarKeys();

      } catch (error) {
        loginError.textContent = error.message || "Erro ao fazer login.";
      } finally {
        setLoading(loginBtn, false, "Entrando...", "Entrar");
      }
    }

    function logoutAdmin() {
      clearToken();
      lastKey = "";
      generatedKey.textContent = "Nenhuma key gerada ainda.";
      generatedInfo.textContent = "";
      keysList.innerHTML = "";
      panelMsg.textContent = "";
      showLogin();
    }

    async function carregarKeys() {
      panelMsg.textContent = "Carregando keys...";

      try {
        const data = await apiFetch("/admin/keys", {
          method: "GET"
        });

        const keys = Array.isArray(data.keys) ? data.keys : [];
        renderKeys(keys);
        panelMsg.textContent = "";

      } catch (error) {
        panelMsg.textContent = "";
        keysList.innerHTML = `
          <div class="key-item">
            <div class="key-date">${escapeHTML(error.message)}</div>
          </div>
        `;
      }
    }

    async function gerarKey() {
      const dias = Number(document.getElementById("duration").value);

      if (!dias || dias <= 0) {
        panelMsg.textContent = "Escolha uma duração válida.";
        return;
      }

      panelMsg.textContent = "";
      setLoading(createBtn, true, "Gerando...", "Gerar Key");

      try {
        const data = await apiFetch("/admin/keys/create", {
          method: "POST",
          body: JSON.stringify({
            duration_days: dias
          })
        });

        if (!data.key) {
          throw new Error("A API não retornou a key criada.");
        }

        lastKey = data.key;
        generatedKey.textContent = data.key;

        const vencimento = data.expires_at ? formatDate(new Date(data.expires_at)) : "Não informado";
        generatedInfo.textContent = `Duração: ${dias} dia(s) | Vence em: ${vencimento}`;

        panelMsg.textContent = "Key criada com sucesso.";
        await carregarKeys();

      } catch (error) {
        panelMsg.textContent = error.message || "Erro ao gerar key.";
      } finally {
        setLoading(createBtn, false, "Gerando...", "Gerar Key");
      }
    }

    async function deixarOffline(key) {
      const confirmar = confirm("Tem certeza que deseja deixar esta key offline? Ela vai parar de funcionar.");

      if (!confirmar) return;

      panelMsg.textContent = "Atualizando key...";

      try {
        await apiFetch("/admin/keys/offline", {
          method: "POST",
          body: JSON.stringify({ key })
        });

        panelMsg.textContent = "Key ficou offline.";
        await carregarKeys();

      } catch (error) {
        panelMsg.textContent = error.message || "Erro ao deixar key offline.";
      }
    }

    async function ativarKey(key) {
      const confirmar = confirm("Deseja ativar esta key? Ela volta a funcionar se ainda não estiver vencida.");

      if (!confirmar) return;

      panelMsg.textContent = "Atualizando key...";

      try {
        await apiFetch("/admin/keys/online", {
          method: "POST",
          body: JSON.stringify({ key })
        });

        panelMsg.textContent = "Key ativada.";
        await carregarKeys();

      } catch (error) {
        panelMsg.textContent = error.message || "Erro ao ativar key.";
      }
    }

    function getKeyStatus(item) {
      const venceu = item.expires_at ? new Date() > new Date(item.expires_at) : false;

      if (item.offline || item.active === false) {
        return {
          text: "Offline",
          className: "status-offline"
        };
      }

      if (venceu) {
        return {
          text: "Expirada",
          className: "status-expired"
        };
      }

      return {
        text: "Ativa",
        className: "status-active"
      };
    }

    function renderKeys(keys) {
      if (!keys.length) {
        keysList.innerHTML = `
          <div class="key-item">
            <div class="key-date">Nenhuma key criada ainda.</div>
          </div>
        `;
        return;
      }

      keysList.innerHTML = keys.map((item) => {
        const key = escapeHTML(item.key);
        const status = getKeyStatus(item);
        const isOffline = item.offline || item.active === false;

        const duration = escapeHTML(item.duration_days || "-");
        const createdAt = item.created_at ? formatDate(new Date(item.created_at)) : "-";
        const expiresAt = item.expires_at ? formatDate(new Date(item.expires_at)) : "-";

        return `
          <div class="key-item ${isOffline ? "offline" : ""}">
            <div class="key-code">${key}</div>

            <div class="key-date">
              Status:
              <span class="${status.className}">
                ${escapeHTML(status.text)}
              </span>
              | Duração: ${duration} dia(s)
            </div>

            <div class="key-date">
              Criada: ${escapeHTML(createdAt)}
            </div>

            <div class="key-date">
              Vence: ${escapeHTML(expiresAt)}
            </div>

            ${
              isOffline
                ? `<button class="btn-online" onclick="ativarKey('${key}')">Ativar Key</button>`
                : `<button class="btn-offline" onclick="deixarOffline('${key}')">Deixar Offline</button>`
            }
          </div>
        `;
      }).join("");
    }

    function copiarKey() {
      if (!lastKey) {
        panelMsg.textContent = "Nenhuma key para copiar.";
        return;
      }

      navigator.clipboard.writeText(lastKey).then(() => {
        panelMsg.textContent = "Key copiada com sucesso.";
      }).catch(() => {
        panelMsg.textContent = "Não foi possível copiar.";
      });
    }

    function formatDate(date) {
      if (Number.isNaN(date.getTime())) {
        return "-";
      }

      return date.toLocaleString("pt-BR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    adminPassword.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        loginAdmin();
      }
    });

    window.addEventListener("load", async function() {
      const token = getToken();

      if (!token) {
        showLogin();
        return;
      }

      showPanel();
      await carregarKeys();
    });
  </script>

</body>
</html>
