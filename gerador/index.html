<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    base-uri 'self';
    object-src 'none';
    frame-ancestors 'none';
    form-action 'self';
    img-src 'self' data: https:;
    style-src 'self';
    script-src 'self';
    connect-src 'self';
    upgrade-insecure-requests;
  ">

  <title>Veltrix Space</title>

  <link rel="icon" type="image/png" href="./css/veltrix.png">
  <link rel="apple-touch-icon" href="./css/veltrix.png">
  <link rel="stylesheet" href="./css/neon.css">
</head>

<body>

  <a
    class="discord-float"
    href="https://discord.gg/gmVcJQNNeM"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Entrar no Discord"
    title="Entrar no Discord"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19.54 5.35A16.5 16.5 0 0 0 15.52 4l-.2.36a12.6 12.6 0 0 1 3.52 1.78 11.9 11.9 0 0 0-4.18-1.28 12 12 0 0 0-5.32 0 11.9 11.9 0 0 0-4.18 1.28A12.6 12.6 0 0 1 8.68 4.36L8.48 4a16.5 16.5 0 0 0-4.02 1.35C1.92 9.12 1.23 12.8 1.57 16.42A16.6 16.6 0 0 0 6.5 18.9l.6-.82a10.8 10.8 0 0 1-1.9-.92l.45-.34a12.6 12.6 0 0 0 12.7 0l.45.34a10.8 10.8 0 0 1-1.9.92l.6.82a16.6 16.6 0 0 0 4.93-2.48c.4-4.2-.68-7.84-2.89-11.07ZM8.35 14.2c-.95 0-1.72-.88-1.72-1.96s.75-1.96 1.72-1.96c.96 0 1.74.88 1.72 1.96 0 1.08-.76 1.96-1.72 1.96Zm7.3 0c-.95 0-1.72-.88-1.72-1.96s.75-1.96 1.72-1.96c.96 0 1.74.88 1.72 1.96 0 1.08-.76 1.96-1.72 1.96Z"/>
    </svg>
  </a>

  <section id="loginScreen" class="login-screen">
    <div class="login-box">

      <div class="brand-mark" aria-hidden="true">
        <img
          src="./css/veltrix.png"
          alt=""
          class="veltrix-logo"
          draggable="false"
        >
      </div>

      <h1 class="login-title">Veltrix Space</h1>
      <p class="login-subtitle">Área privada para acesso com key válida.</p>

      <form id="loginForm" autocomplete="off">
        <input
          type="text"
          id="keyInput"
          placeholder="Digite sua key"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
        >

        <button id="loginBtn" type="submit">Entrar</button>

        <a
          class="buy-key-link"
          href="https://discord.gg/gmVcJQNNeM"
          target="_blank"
          rel="noopener noreferrer"
        >
          Comprar Key Agora
        </a>
      </form>

      <p class="support-line">
        Suporte:
        <a href="mailto:suporte@veltrix.space">suporte@veltrix.space</a>
      </p>

      <p id="loginMsg" class="login-error"></p>
    </div>
  </section>

  <main id="appContainer" class="container hidden">

    <div class="header">
      <div class="brand-mark app-brand" aria-hidden="true">
        <img
          src="./css/veltrix.png"
          alt=""
          class="veltrix-logo app-logo"
          draggable="false"
        >
      </div>

      <div class="badge">
        <span class="badge-dot"></span>
        Key ativa
      </div>

      <h2>Veltrix Space</h2>
      <p class="app-subtitle">
        Escolha a plataforma, defina a quantidade e gere os resultados com acesso validado.
      </p>
    </div>

    <div class="dropdown" id="dropdown">
      <button class="selected" id="selectedBtn" type="button">
        <span class="option" id="selectedOption"></span>
        <span>▼</span>
      </button>

      <div class="options" id="options">

        <button type="button" class="option-btn" data-type="canva">
          <img
            class="icon"
            src="https://static.vecteezy.com/system/resources/previews/032/329/171/non_2x/canva-icon-logo-symbol-free-png.png"
            alt="Canva"
          >
          <span>Canva</span>
        </button>

        <button type="button" class="option-btn" data-type="spotify">
          <img
            class="icon"
            src="https://s3-alpha.figma.com/hub/file/2734964093/9f5edc36-eb4d-414a-8447-10514f2bc224-cover.png"
            alt="Spotify"
          >
          <span>Spotify</span>
        </button>

        <button type="button" class="option-btn" data-type="deezer">
          <img
            class="icon"
            src="https://play-lh.googleusercontent.com/8WWCKxLfdLkAEuPF67AnsqUNgo20W2z777yMLtqo64i2MkzKjef4g0mw-8eAqekAbU4=w240-h480-rw"
            alt="Deezer"
          >
          <span>Deezer</span>
        </button>

        <button type="button" class="option-btn" data-type="yt">
          <img
            class="icon"
            src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png"
            alt="YouTube"
          >
          <span>YouTube</span>
        </button>

        <button type="button" class="option-btn" data-type="primevideo">
          <img
            class="icon"
            src="https://m.media-amazon.com/images/I/31W9hs7w0JL.png"
            alt="Prime Video"
          >
          <span>Prime Video</span>
        </button>

      </div>
    </div>

    <input type="number" id="qtd" placeholder="Quantidade" min="1" max="500">

    <textarea id="resultado" readonly wrap="off" placeholder="Resultado gerado aparecerá aqui..."></textarea>

    <button id="generateBtn" type="button">Gerar</button>

    <div class="top-actions">
      <button class="btn-secondary" id="copyBtn" type="button">Copiar Resultado</button>
      <button class="btn-secondary" id="clearBtn" type="button">Limpar</button>
    </div>

    <div id="keyInfo" class="key-info">Verificando acesso...</div>
  </main>

  <script src="./js/auth.js" defer></script>
  <script src="./js/app.js" defer></script>
</body>
</html>
