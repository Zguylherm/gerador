<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    base-uri 'self';
    object-src 'none';
    frame-ancestors 'none';
    form-action 'self';
    img-src 'self' data: https:;
    style-src 'self';
    script-src 'self';
    connect-src 'self';
    upgrade-insecure-requests;
  ">

  <title>Gerador Pro</title>
  <link rel="stylesheet" href="./css/neon.css">
</head>

<body>

  <!-- LOGIN SEPARADO -->
  <section id="loginScreen" class="login-screen">
    <div class="login-box">
      <div class="login-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 7a2 2 0 1 1 2 2"></path>
          <path d="M16.5 8.5 21 4"></path>
          <path d="m19 6 1.5 1.5"></path>
          <path d="M9 14a5 5 0 1 1 3.54-8.54"></path>
          <path d="M4 20h10"></path>
          <path d="M7 17v3"></path>
          <path d="M11 17v3"></path>
        </svg>
      </div>

      <h1 class="login-title">Acesso Protegido</h1>
      <p class="login-subtitle">By - zGuylherme.</p>

      <form id="loginForm" autocomplete="off">
        <input
          type="text"
          id="keyInput"
          placeholder="Digite sua key"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
        >

        <button id="loginBtn" type="submit">Entrar</button>
      </form>

      <p id="loginMsg" class="login-error"></p>
    </div>
  </section>

  <!-- APP PRINCIPAL -->
  <main id="appContainer" class="container hidden">

    <div class="header">
      <div class="badge">
        <span class="badge-dot"></span>
        Key ativa
      </div>

      <h2>Gerador Pro</h2>
      <p class="app-subtitle">By - zGuylherme</p>
      <p class="app-subtitle">Painel liberado com validação segura</p>
    </div>

    <div class="dropdown" id="dropdown">
      <button class="selected" id="selectedBtn" type="button">
        <span class="option" id="selectedOption"></span>
        <span>▼</span>
      </button>

      <div class="options" id="options">

        <button type="button" class="option-btn" data-type="canva">
          <img
            class="icon"
            src="https://static.vecteezy.com/system/resources/previews/032/329/171/non_2x/canva-icon-logo-symbol-free-png.png"
            alt="Canva"
          >
          <span>Canva</span>
        </button>

        <button type="button" class="option-btn" data-type="spotify">
          <img
            class="icon"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRv-ojvgheqFF4jc5EM9MYcOkULjVY3oG2hzw&s"
            alt="Spotify"
          >
          <span>Spotify</span>
        </button>

        <button type="button" class="option-btn" data-type="deezer">
          <img
            class="icon"
            src="https://medias.lesindesradios.fr/t:app(web)/t:r(unknown)/fit-in/1100x2000/filters:format(webp)/medias/UBL5BgYYYQ/image/deezer1742470097798.png"
            alt="Deezer"
          >
          <span>Deezer</span>
        </button>

        <button type="button" class="option-btn" data-type="yt">
          <img
            class="icon"
            src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Logo_of_YouTube_%282013-2015%29.svg/960px-Logo_of_YouTube_%282013-2015%29.svg.png"
            alt="YouTube"
          >
          <span>YouTube</span>
        </button>

      </div>
    </div>

    <input type="number" id="qtd" placeholder="Quantidade" min="1" max="500">

    <textarea id="resultado" readonly wrap="off" placeholder="Resultado gerado aparecerá aqui..."></textarea>

    <button id="generateBtn" type="button">Gerar</button>

    <div class="top-actions">
      <button class="btn-secondary" id="copyBtn" type="button">Copiar Resultado</button>
      <button class="btn-secondary" id="clearBtn" type="button">Limpar</button>
    </div>

    <div id="keyInfo" class="key-info">Verificando acesso...</div>
  </main>

  <script src="./js/auth.js" defer></script>
  <script src="./js/app.js" defer></script>
</body>
</html>
